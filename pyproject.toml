[project]
name = "dancr"
dynamic = ["version"]
description = "DANCR: Data Analysis Node-based Canvas for Research. Visual pipelines over very large tabular and time-series data, with a headless CLI and MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Drew Greene", email = "drewdgreene@gmail.com" }]
# Upper bounds at the next major version: DANCR uses APIs a major release may change (the mcp 2 module
# layout, Polars' streaming engine).
dependencies = [
    "polars>=1.38,<2",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "matplotlib>=3.8,<4",
    "fastexcel>=0.12,<1",
    "xlsxwriter>=3.2,<4",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6.10,<7", "pillow>=10,<13"]

[project.scripts]
dancr = "dancr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dancr.__version__" }

[tool.setuptools.packages.find]
include = ["dancr*"]

[tool.setuptools.package-data]
dancr = ["assets/*", "help/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
