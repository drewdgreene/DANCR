[project]
name = "dancr"
dynamic = ["version"]
description = "DANCR: Data Analysis Node-based Canvas for Research. Visual pipelines over very large tabular and time-series data, with a headless CLI and MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Drew Greene", email = "drewdgreene@gmail.com" }]
# Upper bounds at the next major version: DANCR uses APIs a major release may change (the mcp 2 module
# layout, Polars' streaming engine). uv.lock pins what CI builds and tests with.
#
# Every capability ships in the one install (no separate downloads): the geographic steps, database servers,
# and the NetCDF/HDF5 readers are all core dependencies, so a packaged DANCR never asks the person to add an
# extra. The [project.optional-dependencies] groups below stay as aliases for anyone installing from source.
dependencies = [
    "polars>=1.38,<2",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "matplotlib>=3.8,<4",
    "fastexcel>=0.12,<1",
    "xlsxwriter>=3.2,<4",
    "mcp>=2,<3",
    # the Assistant's model client (also pulled in by mcp)
    "httpx>=0.27,<1",
    # geographic work beyond points: polygons, spatial joins and reprojection
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "pyogrio>=0.9,<1",
    # reading a database server (SQLite is built in)
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.1,<4",
    # reading scientific array formats (Load NetCDF, Load HDF5)
    "xarray>=2024.1,<2026",
    "netCDF4>=1.6,<2",
    "h5py>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.6,<1", "mypy>=1.10,<2"]
build = ["pyinstaller>=6.10,<7", "pillow>=10,<13"]
# Reading PDF/Office/EPUB/HTML documents (Load document). Not a core dependency: MinerU is large (native
# engines and ~0.35-2 GB models) and its wheels may lag the newest Python. The packaged DANCR bundles MinerU
# in .dancr-mineru via packaging/build-mineru.sh; a source user can add it with `uv sync --extra mineru`.
mineru = ["mineru>=4.0,<5"]
# Geographic work beyond points: polygons, spatial joins and reprojection. The point, grid, distance,
# nearest-place and map steps need none of these — they stay pure Polars and numpy.
geo = ["shapely>=2,<3", "pyproj>=3.6,<4", "pyogrio>=0.9,<1"]
# The Assistant: the chat front door to the deterministic engine. It talks to any OpenAI-style
# /v1/chat/completions endpoint (Fireworks, OpenAI, a local server). The engine, and everything else
# in DANCR, works without it.
assistant = ["httpx>=0.27,<1"]
# Reading a database server (Load from a database). SQLite is built in; this adds PostgreSQL and others.
db = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.1,<4"]
# Reading scientific array formats (Load NetCDF, Load HDF5).
science = ["xarray>=2024.1,<2026", "netCDF4>=1.6,<2", "h5py>=3.10,<4"]

[project.scripts]
dancr = "dancr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dancr.__version__" }

[tool.setuptools.packages.find]
include = ["dancr*"]

[tool.setuptools.package-data]
dancr = ["assets/*", "assets/icons/*", "assets/geo/*", "help/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

# Static checks. Start narrow (errors and pyflakes) so the gate is green from day one; widen as the existing
# import-order (I001) and one-line-statement (E702/E401) style is cleaned up. Run: uv run ruff check dancr tests
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", ".dancr-mineru"]

[tool.ruff.lint]
select = ["E9", "F"]
# F401/F841 are unused imports/variables to be tidied; they do not change behaviour
ignore = ["F401", "F841"]

# Type checking. The target is 3.12 because the installed numpy stubs use 3.12 syntax (PEP 695) that
# mypy cannot parse with a 3.11 target; runtime support stays 3.11 and the pytest matrix tests 3.11 and
# 3.14, so 3.11 compatibility is covered behaviourally. Heavy third-party stubs are not analyzed (their
# types are stricter/newer than this code's usage); DANCR's own annotations are checked. The remaining
# pre-existing findings are allow-listed per module below and recorded in docs/OPEN.md. Run: uv run mypy dancr
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "normal"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["polars.*", "numpy.*", "scipy.*", "matplotlib.*", "pyproj.*", "shapely.*", "pyogrio.*",
          "xarray.*", "h5py.*", "fastexcel.*"]
follow_imports = "skip"

# The remaining allowance: pre-existing modules not yet typed to mypy's satisfaction. New modules
# (identity, repo, graph, events, scenarios, crossask, gateway, rag, verify, ...) are checked. Burn this
# list down by fixing the modules it names; do not add to it without a note in docs/OPEN.md.
[[tool.mypy.overrides]]
module = [
    "dancr.ui.*",
    "dancr.cli", "dancr.mcp_server", "dancr.synth",
    "dancr.headless", "dancr.headless._context",
    "dancr.core.answers", "dancr.core.ask", "dancr.core.ask.vocab", "dancr.core.conditions",
    "dancr.core.executor", "dancr.core.fair.schemaorg", "dancr.core.geo", "dancr.core.layout",
    "dancr.core.model", "dancr.core.planner", "dancr.core.samples", "dancr.core.understand",
    "dancr.core.nodes.basic", "dancr.core.nodes.bio", "dancr.core.nodes.combine",
    "dancr.core.nodes.contract", "dancr.core.nodes.entry", "dancr.core.nodes.geo",
    "dancr.core.nodes.groups", "dancr.core.nodes.groups_stats", "dancr.core.nodes.inquiry.quality",
    "dancr.core.nodes.load", "dancr.core.nodes.load_folder", "dancr.core.nodes.model",
    "dancr.core.recipes._common", "dancr.core.recipes._plan",
    "dancr.views.chartquery", "dancr.views.geo_draw", "dancr.views.lod", "dancr.views.pdf",
    "dancr.views.render",
]
ignore_errors = true
