name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e ".[build]"
      - name: Icons
        run: .venv\Scripts\python packaging\make_icons.py
      - name: Freeze
        run: .venv\Scripts\pyinstaller --noconfirm --clean packaging\dancr.spec
      - uses: actions/upload-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
          if-no-files-found: error

  installer:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: python -m pip install --quiet pillow
      - run: python packaging/make_icons.py
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
      - name: Compile installer
        run: PY=python bash packaging/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DANCR-Setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-Setup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
      - run: cd dist && zip -qr DANCR-windows.zip DANCR
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/DANCR-windows.zip
