name: build

# Tests on every push, on Linux, Windows and macOS. Pushes to main (and manual runs) also build and smoke-test
# the frozen apps for Windows (installer + zip), Linux and macOS; a v* tag does too and publishes a release.
# Every job installs exactly what uv.lock pins, with the Python the local builds use.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON: "3.14"
  PYTHONUTF8: "1"        # Windows CI: UTF-8 for stdio, subprocess text and open(), so non-cp1252 output is safe

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]         # the oldest supported and the one the builds ship
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries for the offscreen GUI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - name: The Flatpak's pinned requirements match uv.lock
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt | diff - packaging/requirements.txt
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/') && matrix.python == '3.14' && runner.os == 'Linux'
        run: |
          v=$(uv run --no-sync python -c "import dancr; print(dancr.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match dancr.__version__ $v"; exit 1; }
      - name: Lint
        if: matrix.python == '3.11'
        run: uvx ruff check dancr tests
      - name: Types
        if: matrix.python == '3.11'
        run: uv run --no-sync mypy dancr
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -q -p no:cacheprovider

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --extra build --python $env:PYTHON
      - name: Icons
        run: uv run --no-sync python packaging\make_icons.py
      - name: Freeze
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging\dancr.spec
      - name: The frozen command line, report PDF and MCP server work
        run: uv run --no-sync python packaging\smoke.py dist\DANCR\dancr-cli.exe smoke
      - uses: actions/upload-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
          if-no-files-found: error

  installer:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: uv sync --locked --extra build --python "$PYTHON"
      - run: uv run --no-sync python packaging/make_icons.py
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
      - name: Compile installer
        run: PY=.venv/bin/python bash packaging/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DANCR-Setup
          path: dist/*.exe
          if-no-files-found: error

  unix:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: DANCR-linux
            file: dist/DANCR-linux.tar.gz
          - os: macos-latest
            artifact: DANCR-macos
            file: dist/DANCR-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra build --python "$PYTHON"
      - run: PY=.venv/bin/python bash packaging/build.sh
      - name: Qt libraries for the frozen PDF helper
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: The frozen command line, report PDF and MCP server work
        run: |
          cli=dist/DANCR/dancr-cli; [ -x "$cli" ] || cli=dist/DANCR.app/Contents/MacOS/dancr-cli
          uv run --no-sync python packaging/smoke.py "$cli" smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  flatpak:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak builder and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build the Flatpak bundle
        run: |
          src="$RUNNER_TEMP/dancr-src"
          mkdir -p "$src"
          git archive HEAD | tar -x -C "$src"
          flatpak-builder --user --state-dir="$RUNNER_TEMP/fp-state" --repo="$RUNNER_TEMP/fp-repo" --force-clean "$RUNNER_TEMP/fp-build" "$src/packaging/org.dancr.DANCR.yaml"
          version=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('dancr/__init__.py').read_text()).group(1))")
          mkdir -p dist
          flatpak build-bundle "$RUNNER_TEMP/fp-repo" "dist/DANCR-${version}.flatpak" org.dancr.DANCR
      - uses: actions/upload-artifact@v4
        with:
          name: DANCR-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [installer, unix, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-Setup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-windows
          path: dist/DANCR
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: DANCR-flatpak
          path: dist
      - run: cd dist && zip -qr DANCR-windows.zip DANCR
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/DANCR-windows.zip
            dist/DANCR-linux.tar.gz
            dist/DANCR-macos.zip
            dist/*.flatpak
